name: snowball

# 매일 13:00 KST (= 04:00 UTC). workflow_dispatch 로 수동 즉시 실행도 가능.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bots/snowball/main.py
        env:
          PYTHONPATH: .  # shared 모듈 import (repo root)
          TELEGRAMBOTTOKEN_SUHMPLUS: ${{ secrets.TELEGRAMBOTTOKEN_SUHMPLUS }}
          TELEGRAMCHATID_SUHMFUTURE: ${{ vars.TELEGRAMCHATID_SUHMFUTURE }}
          GOOGLESAJSON_SNOWBALLREADER: ${{ secrets.GOOGLESAJSON_SNOWBALLREADER }}
          SPREADSHEETID_SNOWBALL: ${{ vars.SPREADSHEETID_SNOWBALL }}
